<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUPERINTELLIGENCE.NET</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        main {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem 1.25rem;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.2rem, 6vw, 3rem);
            line-height: 1.15;
            letter-spacing: 0.04em;
            max-width: 100%;
            width: 100%;
        }

        .divider {
            width: 55%;
            max-width: 420px;
            min-width: 180px;
            border: 0;
            border-top: 1px solid #000000;
            margin: 2.5rem auto;
        }

        .coming {
            margin: 0;
            font-size: clamp(1.1rem, 4.5vw, 1.4rem);
            line-height: 1.4;
        }

        .tagline {
            margin: 2.5rem 0 0;
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            font-style: italic;
            line-height: 1.5;
            max-width: 90%;
        }
    </style>
</head>

<body>
    <main>
        <h1>SOUPERINTELLIGENCE.NET</h1>

        <hr class="divider">

        <p class="coming">Coming soon</p>

        <p class="tagline">When Super Intelligence Is Dumber Than Soup</p>
    </main>
</body>
</html>
